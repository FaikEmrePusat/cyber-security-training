[package]
name = "usta-desktop"
version = "0.1.0"
description = "Usta — one next action (Windows tray shell)"
edition = "2021"

[lib]
name = "usta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
